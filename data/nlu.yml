version: "3.1"
nlu:
  - intent: greet
    examples: |
      - hello
      - hi
      - hey there
      - greetings

  - intent: goodbye
    examples: |
      - bye
      - goodbye
      - see you later
      - have a nice day

  - intent: affirm
    examples: |
      - yes
      - indeed
      - correct
      - absolutely

  - intent: deny
    examples: |
      - no
      - not really
      - I don't think so

  - intent: book_table
    examples: |
      - I want to book a table
      - Book a table for me
      - Reserve a table

  - intent: provide_date
    examples: |
      - for tomorrow
      - on Friday
      - January 12th

  - intent: provide_people
    examples: |
      - for two people
      - for four
      - just me

  - intent: provide_name
    examples: |
      - My name is John
      - for Sarah
      - under Mike

  - intent: provide_phone
    examples: |
      - My phone number is 123456789
      - reach me at 987654321
      - 345678123

  - intent: cancel_reservation
    examples: |
      - I want to cancel my reservation
      - cancel the booking
      - remove my reservation

  - intent: get_reservation_info
    examples: |
      - What is my reservation information?
      - Show my booking details

  - intent: modify_comment
    examples: |
      - I want to add a comment to my reservation
      - add a note to my booking
      - modify the reservation comment

  - intent: get_menu
    examples: |
      - What is the menu today?
      - show me the menu
      - What are the options?

  - intent: get_allergens
    examples: |
      - Do you have a list of allergens?
      - Show allergens
      - Any allergen information?
