version: "3.1"
rules:
  - rule: Say goodbye
    steps:
      - intent: goodbye
      - action: utter_goodbye

  - rule: Say 'I am a bot' when user asks
    steps:
      - intent: bot_challenge
      - action: utter_iamabot

  - rule: Book a table by asking date
    steps:
      - intent: book_table
      - action: utter_ask_date

  - rule: Ask for number of people after date
    steps:
      - intent: provide_date
      - action: utter_ask_people

  - rule: Ask for name after number of people
    steps:
      - intent: provide_people
      - action: utter_ask_name

  - rule: Ask for phone after name
    steps:
      - intent: provide_name
      - action: utter_ask_phone

  - rule: Provide menu link
    steps:
      - intent: get_menu
      - action: action_get_menu

  - rule: Provide allergens
    steps:
      - intent: get_allergens
      - action: action_get_allergens
