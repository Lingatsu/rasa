version: "3.1"
stories:
  - story: happy path for booking
    steps:
      - intent: greet
      - action: utter_greet
      - intent: book_table
      - action: utter_ask_date
      - intent: provide_date
      - action: utter_ask_people
      - intent: provide_people
      - action: utter_ask_name
      - intent: provide_name
      - action: utter_ask_phone
      - intent: provide_phone
      - action: check_availability
      - action: utter_confirm_reservation
      - intent: affirm
      - action: utter_reservation_complete

  - story: cancellation path
    steps:
      - intent: cancel_reservation
      - action: action_cancel_reservation
      - action: utter_cancellation_complete

  - story: retrieve reservation info
    steps:
      - intent: get_reservation_info
      - action: action_get_reservation_info

  - story: modify reservation comment
    steps:
      - intent: modify_comment
      - action: action_modify_comment
      - action: utter_comment_updated

  - story: get menu and allergens
    steps:
      - intent: get_menu
      - action: action_get_menu
      - intent: get_allergens
      - action: action_get_allergens
