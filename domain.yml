version: "3.1"
intents:
  - greet
  - goodbye
  - affirm
  - deny
  - book_table
  - provide_date
  - provide_people
  - provide_name
  - provide_phone
  - cancel_reservation
  - get_reservation_info
  - modify_comment
  - get_menu
  - get_allergens

entities:
  - date
  - people
  - name
  - phone

slots:
  date:
    type: text
    mappings:
      - type: from_entity
        entity: date
  people:
    type: text
    mappings:
      - type: from_entity
        entity: people
  name:
    type: text
    mappings:
      - type: from_entity
        entity: name
  phone:
    type: text
    mappings:
      - type: from_entity
        entity: phone

responses:
  utter_greet:
    - text: "Hello! How can I help you with your reservation?"

  utter_goodbye:
    - text: "Goodbye!"

  utter_iamabot:
    - text: "I'm a bot here to assist you with reservations."

  utter_ask_date:
    - text: "On which date would you like the reservation?"

  utter_ask_people:
    - text: "How many people will be dining?"

  utter_ask_name:
    - text: "Whose name should the reservation be under?"

  utter_ask_phone:
    - text: "Can I have a contact number?"

  utter_confirm_reservation:
    - text: "Your reservation is available. Shall I proceed?"

  utter_reservation_complete:
    - text: "Your table is booked! Thank you."

  utter_cancellation_complete:
    - text: "Your reservation has been canceled."

  utter_comment_updated:
    - text: "Your comment has been added to the reservation."

  action_get_menu:
    - text: "Today's menu includes a variety of fresh options. Visit [menu link]."

  action_get_allergens:
    - text: "We offer an allergen list on request. Please ask your server."
    
actions:
  - check_availability
  - action_get_menu
  - action_get_allergens
  - action_get_reservation_info
  - action_modify_comment
  - action_cancel_reservation
